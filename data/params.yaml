# Production params for denario-scientists fleet
# Models follow denario_fleet/fleets/qm9-joint/params.yaml (validated by its check_params.py):
# gemini-3-flash-preview for bulk engineer/researcher work, gemini-3.1-pro-preview for
# planning, plan review, idea/methods writing and the paper, gemini-3.1-flash-lite elsewhere.

max_iterations: 12

EDA module:
   max_n_steps: 8
   max_n_attempts: 10
   code_execution_timeout: 300
   enable_vlm_review: true
   engineer:
      model: gemini-3-flash-preview
      temperature: 0.2
   researcher:
      model: gemini-3-flash-preview
      temperature: 0.2
   planner:
      model: gemini-3.1-pro-preview
      temperature: 0.2
   plan_reviewer:
      model: gemini-3.1-pro-preview
      temperature: 0.2
   orchestration:
      model: gemini-3.1-flash-lite
      temperature: 0.2
   evaluator:
      model: gemini-3.1-flash-lite
      temperature: 0.2

Idea module:
   idea_sampler:
      model: gemini-3.1-pro-preview
      temperature: 0.7
   idea_selector1:
      model: gemini-3.1-flash-lite
      temperature: 0.1
   idea_selector2:
      model: gemini-3.1-flash-lite
      temperature: 0.1
   idea_selector3:
      model: gemini-3.1-flash-lite
      temperature: 0.1
   idea_chooser:
      model: gemini-3.1-flash-lite
      temperature: 0.1
   idea_maker:
      model: gemini-3.1-pro-preview
      temperature: 0.7
   idea_hater:
      model: gemini-3.1-flash-lite
      temperature: 0.1

Literature module:
   literature:
      model: gemini-3.1-flash-lite
      temperature: 0.2
   summarizer:
      model: gemini-3.1-flash-lite
      temperature: 0.2

Methods module:
   methods:
      model: gemini-3.1-pro-preview
      temperature: 0.1
   reviewer1:
      model: gemini-3.1-flash-lite
      temperature: 0.1
   reviewer2:
      model: gemini-3.1-flash-lite
      temperature: 0.2
   reviewer3:
      model: gemini-3.1-flash-lite
      temperature: 0.2
   improver:
      model: gemini-3.1-pro-preview
      temperature: 0.2

Analysis module:
   max_n_steps: 10
   max_n_attempts: 10
   code_execution_timeout: 300
   enable_vlm_review: false
   engineer:
      model: gemini-3-flash-preview
      temperature: 0.1
   researcher:
      model: gemini-3-flash-preview
      temperature: 0.1
   planner:
      model: gemini-3.1-pro-preview
      temperature: 0.1
   plan_reviewer:
      model: gemini-3.1-pro-preview
      temperature: 0.1
   orchestration:
      model: gemini-3.1-flash-lite
      temperature: 0.2
   evaluator:
      model: gemini-3.1-flash-lite
      temperature: 0.2

Evaluator module:
   reporter:
      model: gemini-3.1-flash-lite
      temperature: 0.1
   idea_reviewer:
      model: gemini-3.1-flash-lite
      temperature: 0.2
   methods_reviewer:
      model: gemini-3.1-flash-lite
      temperature: 0.2
   input_reviewer:
      model: gemini-3.1-flash-lite
      temperature: 0.2
   new_iteration_reviewer:
      model: gemini-3.1-pro-preview
      temperature: 0.1
   results_reviewer:
      model: gemini-3.1-flash-lite
      temperature: 0.2
   plan_consistency_reviewer:
      model: gemini-3.1-flash-lite
      temperature: 0.1
   code_consistency_reviewer:
      model: gemini-3.1-flash-lite
      temperature: 0.1

Paper module:
   keywords_writer:
      model: gemini-3.1-flash-lite
      temperature: 0.1
   section_writer:
      model: gemini-3.1-pro-preview
      temperature: 0.1
   refiner:
      model: gemini-3.1-pro-preview
      temperature: 0.1
   audio_summarizer:
      model: gemini-3.1-flash-lite
      temperature: 0.3


Citations:
   # Backend used when add_citations is enabled. Options: 'perplexity', 'valency'.
   backend: valency

   # Only used when backend = valency. The LLM that decides which retrieved
   # papers to cite where, and emits \citep{} markers in-place.
   citation_inserter:
      model: gemini-3.1-flash-lite
      temperature: 0.1

Classifier module:
   archive_classifier:
      model: gemini-3.1-flash-lite
      temperature: 0.1
   subcategory_classifier:
      model: gemini-3.1-flash-lite
      temperature: 0.1

Reviewer module:
   reviewer1:
      model: gemini-3.1-flash-lite
      temperature: 0.2
   reviewer2:
      model: gemini-3.1-flash-lite
      temperature: 0.2
   reviewer3:
      model: gemini-3.1-flash-lite
      temperature: 0.2
   meta_reviewer:
      model: gemini-3.1-pro-preview
      temperature: 0.2
